<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ status_code }} — StoreStock</title>

  <style>
    :root {
      --navy: #151836;
      --mint: #3DE0C8;
      --paper: #F7F8FC;
      --stone: #667085;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      font-family: Arial, sans-serif;
      color: var(--navy);
    }

    .error-card {
      max-width: 460px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(21, 24, 54, 0.12);
    }

    .status-code {
      margin: 0;
      color: var(--mint);
      font-size: 64px;
      font-weight: 800;
    }

    .message {
      color: var(--stone);
      line-height: 1.6;
    }

    .home-link {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--navy);
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="error-card">
    <p class="status-code">{{ status_code }}</p>
    <h1>{{ title }}</h1>
    <p class="message">{{ message }}</p>
    <a class="home-link" href="{{ url_for('landing') }}">Return home</a>
  </main>
</body>
</html>
